name: Watch for new edits

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 08:17 Mountain (standard time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikisscbot-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install opentimestamps-client
      - name: Check the last 30 hours
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python -m wikisscbot watch --hours 30 --post
      - name: Verify chain and checksums
        run: python -m wikisscbot verify
      - name: Timestamp new manifests and upgrade pending proofs
        continue-on-error: true
        run: |
          for m in data/manifests/*.json; do
            [ -e "$m.ots" ] || ots stamp "$m" || true
          done
          # Pending proofs gain a Bitcoin attestation once the calendar's
          # transaction confirms (usually within hours).
          ls data/manifests/*.ots >/dev/null 2>&1 && ots upgrade data/manifests/*.ots || true
      - name: Commit
        run: |
          git config user.name "wikisscbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Watch: $(tail -n1 data/manifests/chain.jsonl | python -c "import json,sys;l=json.load(sys.stdin);print(l['run_id'], l['sha256'][:12])")"
          git pull --rebase origin main
          git push origin HEAD:main
