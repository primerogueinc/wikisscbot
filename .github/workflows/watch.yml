name: Watch for new edits

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 08:17 Mountain (standard time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikisscbot-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the last 30 hours
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python -m wikisscbot watch --hours 30 --post
      - name: Commit new edits
        run: |
          git config user.name "wikisscbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new edits"; exit 0; fi
          git commit -m "Live: new GC edits"
          git pull --rebase origin main
          git push origin HEAD:main
