name: Continuity watch (exploratory)

on:
  push:
    branches: [main]
    paths:
      - "tools/continuity.py"
      - ".github/workflows/continuity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikisscbot-continuity
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull temporary-account edits on GC-heavy pages
        run: python tools/continuity.py
      - name: Commit
        run: |
          git config user.name "wikisscbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Continuity watch: $(python -c "import json;d=json.load(open('research/continuity/latest.json'));print(d['temp_account_edits'],'temp edits on',d['pages_with_temp_edits'],'pages')")"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 20; done
