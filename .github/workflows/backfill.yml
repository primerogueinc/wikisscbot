name: Backfill year

on:
  push:
    branches: [main]
    paths:
      - "wikisscbot/**"
      - "config/settings.json"
      - "config/ranges_gccaedits.json"
      - ".github/workflows/backfill.yml"
  workflow_dispatch:
    inputs:
      year:
        description: "Calendar year to collect (blank = all years in config/settings.json)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: wikisscbot-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      YEAR: ${{ github.event.inputs.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Refresh Shared Services Canada BGP prefixes
        continue-on-error: true
        run: python -m wikisscbot refresh-ranges
      - name: Collect
        run: |
          if [ -n "$YEAR" ]; then python -m wikisscbot backfill --year "$YEAR"
          else python -m wikisscbot backfill; fi
      - name: Commit results
        run: |
          git config user.name "wikisscbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs config/ranges_ssc_bgp.json 2>/dev/null || git add data docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Backfill: $(python -c "import json,glob;print(', '.join(p.split('/')[1]+' '+str(json.load(open(p))['total_edits']) for p in sorted(glob.glob('data/*/summary.json')) if p.split('/')[1].isdigit()))") edits"
          git pull --rebase origin main
          git push origin HEAD:main
