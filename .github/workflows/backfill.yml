name: Backfill year

on:
  push:
    branches: [main]
    paths:
      - "wikisscbot/**"
      - "config/settings.json"
      - "config/ranges_gccaedits.json"
      - ".github/workflows/backfill.yml"
  workflow_dispatch:
    inputs:
      year:
        description: "Calendar year to collect"
        default: "2025"
        required: true

permissions:
  contents: write

concurrency:
  group: wikisscbot-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      YEAR: ${{ github.event.inputs.year || '2025' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Refresh Shared Services Canada BGP prefixes
        continue-on-error: true
        run: python -m wikisscbot refresh-ranges --since "${YEAR}-01-01T00:00"
      - name: Collect ${{ env.YEAR }}
        run: python -m wikisscbot backfill --year "$YEAR"
      - name: Commit results
        run: |
          git config user.name "wikisscbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs config/ranges_ssc_bgp.json 2>/dev/null || git add data docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Backfill ${YEAR}: $(python -c "import json;print(json.load(open('data/${YEAR}/summary.json'))['total_edits'])") edits"
          git pull --rebase origin main
          git push origin HEAD:main
