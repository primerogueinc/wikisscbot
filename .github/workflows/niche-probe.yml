name: Niche wiki probe (exploratory)

on:
  push:
    branches: [main]
    paths:
      - "tools/niche_probe.py"
      - "config/niche_wikis.json"
      - ".github/workflows/niche-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikisscbot-niche
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe niche wikis by Government of Canada IP range
        run: python tools/niche_probe.py
      - name: Commit
        run: |
          git config user.name "wikisscbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/niche
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Niche wiki probe: $(python -c "import json;d=json.load(open('research/niche/probe.json'));print(sum(w.get('gc_edits',0) or 0 for w in d['wikis']),'GC edits across',sum(1 for w in d['wikis'] if w.get('range_queries')),'wikis with range queries')")"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 20; done
